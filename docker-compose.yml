# Deployment on a DigitalOcean Droplet (or any Docker host).
# Content lives in named volumes so it survives image rebuilds.
services:
  web:
    build: .
    image: profile-portfolio:latest
    restart: unless-stopped
    # Only the reverse proxy on the host talks to the app, so bind to loopback.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      # HTTPS is terminated by the reverse proxy in front of this container.
      COOKIE_SECURE: "true"
    volumes:
      - profile-data:/app/data
      - profile-uploads:/app/uploads
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  profile-data:
  profile-uploads:
